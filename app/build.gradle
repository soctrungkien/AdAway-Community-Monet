plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
boolean keyStoreDefined = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    keyStoreDefined = keystoreProperties['storeFile'] &&
            keystoreProperties['storePassword'] &&
            keystoreProperties['keyAlias'] &&
            keystoreProperties['keyPassword']
}

android {
    compileSdk 37
    ndkVersion = '27.2.12479018'
    namespace = 'org.adaway'

    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        minSdk 26
        targetSdk 37
        versionCode libs.versions.appCode.get() as int
        versionName libs.versions.appName.get()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    /*
     * To sign release build, create file keystore.properties at the project root with this content:
     *
     * storeFile=D:/path/to/your.jks
     * storePassword=xxx
     * keyAlias=alias
     * keyPassword=xxx
     */
    if (keyStoreDefined) {
        println "Found keystore.properties. Build will be signed."

        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }

        buildTypes.debug.signingConfig = signingConfigs.release
        buildTypes.release.signingConfig = signingConfigs.release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        compose = true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
//        debug {
//            shrinkResources false
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Do not abort build if lint finds errors
    lint {
        disable 'MissingTranslation'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Match the filename convention already used for published GitHub releases
// (e.g. AdAway.Community.v6.5.1-c.apk) so built APKs need no manual rename.
// AGP 9 removed the old applicationVariants API, so use the variant API instead.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("AdAway.Community.v${libs.versions.appName.get()}.apk")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
    arg("room.incremental", "true")
}

