name: Android CI & Release

on:
  push:
    branches:
      - master
      - main
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Install libpcap (Required for Pcap4J / DnsPacketProxyTest)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Restore SonarCloud packages cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Decode Keystore and Create keystore.properties
          env:
            KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
            STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
            KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          run: |
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "Found Keystore secret. Decoding and signing will be enabled."
              echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

              printf "storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
                "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            else
              echo "Keystore secret not found. Skipping signing."
            fi

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Signed/Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdAway-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Update dependency graph
        uses: mikepenz/gradle-dependency-submission@v1.0.0
        with:
          gradle-dependency-path: "app/build.gradle"
          gradle-build-module: ":app"
          gradle-build-configuration: "releaseCompileClasspath"

      - name: Analyze project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew -Dorg.gradle.jvmargs=-XX:MaxMetaspaceSize=512m sonar